<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fafbf8" />
  <meta name="description" content="Заказы пользователей: месячная динамика, скидки, любимые товары и траты по категориям." />
  <title>Заказы пользователей</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="app" class="page">
  <header class="header"><h1>Заказы пользователей</h1>
    <div v-if="data" class="toolbar-controls"><div class="filter-control period-filter"><span>Период</span><period-picker v-model="periodSelection" :months="data.months" ></period-picker></div><button class="reset-button" :disabled="!hasFilters" @click="resetFilters">Сбросить</button></div>
  </header>
  <main v-cloak>
    <p v-if="loading" class="state" role="status">Загружаем заказы…</p>
    <p v-else-if="error" class="state error" role="alert">{{ error }}</p>
    <template v-else>
      <section class="summary" aria-label="Основные показатели выбранного периода">
        <article class="stat"><h2>Заказы</h2><button type="button" class="stat-value stat-trigger" data-stat="orders" :aria-label="'Заказы: ' + formatCount(summary.orders)" :aria-describedby="tooltip?.kind === 'orders' ? 'dashboard-tooltip' : undefined" @mouseenter="showTooltip($event, {kind:'orders', summary})" @mousemove="showTooltip($event, {kind:'orders', summary})" @focus="showTooltip($event, {kind:'orders', summary})" @mouseleave="hideTooltip" @blur="hideTooltip" @click="showTooltip($event, {kind:'orders', summary})">{{ formatCount(summary.orders) }}</button></article>
        <article class="stat"><h2>Сумма трат</h2><button type="button" class="stat-value stat-trigger" data-stat="spent" :aria-label="'Сумма трат: ' + formatMoney(summary.spent)" :aria-describedby="tooltip?.kind === 'spent' ? 'dashboard-tooltip' : undefined" @mouseenter="showTooltip($event, {kind:'spent', summary})" @mousemove="showTooltip($event, {kind:'spent', summary})" @focus="showTooltip($event, {kind:'spent', summary})" @mouseleave="hideTooltip" @blur="hideTooltip" @click="showTooltip($event, {kind:'spent', summary})">{{ formatMoney(summary.spent) }}</button></article>
        <article class="stat"><h2>Средняя скидка</h2><p class="stat-value amber-text" data-stat="discount">{{ formatDiscount(summary.averageDiscount) }}</p></article>
        <article class="stat"><h2>Сумма скидок</h2><p class="stat-value" data-stat="savings">{{ formatMoney(summary.savings) }}</p></article>
      </section>
      <section class="monthly-section" aria-labelledby="monthly-title">
        <div class="section-heading"><h2 id="monthly-title">{{ year === 'recent' ? 'Динамика за 24 месяца' : 'Динамика по месяцам' }}</h2></div>
        <div class="monthly-grid">
          <article class="chart-panel"><div class="panel-heading"><h3>Количество заказов</h3><strong class="current-value" data-current="orders" :title="'За ' + formatMonth(currentMonth)">{{ formatCount(currentSummary.orders) }}</strong></div><div class="mini-legend"><span><i class="legend-dot green"></i>Доставлено</span><span><i class="legend-dot gray"></i>Отменено</span></div><div ref="ordersChart" class="monthly-chart orders-chart"></div></article>
          <article class="chart-panel"><div class="panel-heading"><h3>Сумма трат</h3><strong class="current-value" data-current="spent" :title="'За ' + formatMonth(currentMonth)">{{ formatMoney(currentSummary.spent) }}</strong></div><p class="panel-note">Только доставленные заказы</p><div ref="spendChart" class="monthly-chart spend-chart"></div></article>
          <article class="chart-panel"><div class="panel-heading"><h3>Средняя скидка</h3><strong class="current-value amber-text" data-current="discount" :title="'За ' + formatMonth(currentMonth)">{{ formatDiscount(currentSummary.averageDiscount) }}</strong></div><p class="panel-note">С учётом количества единиц товара</p><div ref="discountChart" class="monthly-chart discount-chart"></div></article>
        </div>
      </section>
      <section class="products-section" aria-labelledby="products-title">
        <div class="section-heading product-heading"><div><h2 id="products-title">Товары и категории</h2><p class="section-note">{{ formatCount(filteredProducts.length) }} товаров</p></div>
          <div class="product-controls"><div class="filter-control category-filter"><span>Категория</span><dashboard-select v-model="category" :options="categorySelectOptions" label="Категория" control-id="category-options" ></dashboard-select></div><div class="filter-control limit-filter"><span>Показать</span><dashboard-select v-model="limit" :options="limitOptions" label="Размер рейтинга" control-id="limit-options" ></dashboard-select></div></div>
        </div>
        <div class="analysis-grid">
          <article class="category-panel"><h3>Траты на товары по категориям</h3><div ref="categoriesChart" class="categories-chart"></div></article>
          <article class="ranking-panel"><div class="panel-heading"><h3>{{ frequencyMetric === 'quantity' ? 'Топ товаров по количеству' : 'Топ товаров по заказам' }}</h3><div class="segmented" aria-label="Показатель частоты"><button :class="{active: frequencyMetric === 'orders'}" :aria-pressed="frequencyMetric === 'orders'" @click="frequencyMetric = 'orders'">Заказы</button><button :class="{active: frequencyMetric === 'quantity'}" :aria-pressed="frequencyMetric === 'quantity'" @click="frequencyMetric = 'quantity'">Штуки</button></div></div>
            <ol class="ranking-list"><li v-for="(product, index) in frequencyTop" :key="product.id"><button class="product-row" @mouseenter="showTooltip($event, {kind:'product', product})" @mousemove="showTooltip($event, {kind:'product', product})" @focus="showTooltip($event, {kind:'product', product})" @mouseleave="hideTooltip" @blur="hideTooltip" @click="showTooltip($event, {kind:'product', product})" :aria-label="product.name + ', ' + product[frequencyMetric] + (frequencyMetric === 'orders' ? ' заказов' : ' штук')"><span class="rank-number">{{ index + 1 }}</span><img v-if="productImage(product)" class="product-thumb" :src="productImage(product)" alt="" loading="lazy" decoding="async" width="32" height="32" /><span class="rank-product"><span class="product-name">{{ product.name }}</span><span class="rank-bar-track"><span :style="{width: product[frequencyMetric] / frequencyMaximum * 100 + '%'}"></span></span></span><strong class="rank-value">{{ formatCount(product[frequencyMetric]) }}</strong></button></li></ol>
            <p v-if="!frequencyTop.length" class="empty-state">В этом периоде нет товаров выбранной категории.</p>
          </article>
          <article class="ranking-panel"><div class="panel-heading"><h3>Топ товаров по сумме трат</h3></div>
            <ol class="ranking-list spend-ranking"><li v-for="(product, index) in spendingTop" :key="product.id"><button class="product-row" @mouseenter="showTooltip($event, {kind:'product', product})" @mousemove="showTooltip($event, {kind:'product', product})" @focus="showTooltip($event, {kind:'product', product})" @mouseleave="hideTooltip" @blur="hideTooltip" @click="showTooltip($event, {kind:'product', product})" :aria-label="product.name + ', ' + formatMoney(product.spent)"><span class="rank-number">{{ index + 1 }}</span><img v-if="productImage(product)" class="product-thumb" :src="productImage(product)" alt="" loading="lazy" decoding="async" width="32" height="32" /><span class="rank-product"><span class="product-name">{{ product.name }}</span><span class="rank-bar-track"><span :style="{width: product.spent / spendingMaximum * 100 + '%'}"></span></span></span><strong class="rank-value">{{ formatMoney(product.spent) }}</strong></button></li></ol>
            <p v-if="!spendingTop.length" class="empty-state">В этом периоде нет товаров выбранной категории.</p>
          </article>
        </div>
      </section>
      <div v-if="tooltip" id="dashboard-tooltip" class="tooltip" :class="{'is-product':tooltip.kind === 'product'}" :style="tooltipStyle" role="tooltip">
        <template v-if="tooltip.kind === 'orders'"><h4>Заказы</h4><dl><dt>Доставлено</dt><dd>{{ formatCount(tooltip.summary.delivered) }}</dd><dt>Отменено</dt><dd>{{ formatCount(tooltip.summary.cancelled) }}</dd></dl></template>
        <template v-else-if="tooltip.kind === 'spent'"><h4>Сумма трат</h4><dl><dt>Товары</dt><dd>{{ formatMoney(tooltip.summary.goodsSpent) }}</dd><dt>Доставка</dt><dd>{{ formatMoney(tooltip.summary.deliverySpent) }}</dd><dt>Упаковка</dt><dd>{{ formatMoney(tooltip.summary.packagingSpent) }}</dd></dl></template>
        <template v-else-if="tooltip.kind === 'month'"><h4>{{ formatMonth(tooltip.month.month) }}</h4><dl><dt>Заказы</dt><dd>{{ tooltip.month.orders }}</dd><dt>Доставлено</dt><dd>{{ tooltip.month.delivered }}</dd><dt>Отменено</dt><dd>{{ tooltip.month.cancelled }}</dd><dt>Потрачено</dt><dd>{{ formatMoney(tooltip.month.spent) }}</dd><dt>Средняя скидка</dt><dd>{{ formatDiscount(tooltip.month.quantity ? tooltip.month.savings / tooltip.month.quantity : null) }}</dd><dt>Сумма скидок</dt><dd>{{ formatMoney(tooltip.month.savings) }}</dd></dl></template>
        <template v-else-if="tooltip.kind === 'category'"><h4>{{ tooltip.category.name }}</h4><dl><dt>Потрачено</dt><dd>{{ formatMoney(tooltip.category.spent) }}</dd><dt>Доля трат на товары</dt><dd>{{ formatPercent(tooltip.category.spent / categoryGoodsTotal) }}</dd><dt>Заказы с категорией</dt><dd>{{ formatCount(tooltip.category.orders) }}</dd><dt>Единиц товара</dt><dd>{{ formatCount(tooltip.category.quantity) }}</dd><dt>Средняя скидка / шт.</dt><dd>{{ formatDiscount(tooltip.category.averageDiscount) }}</dd></dl></template>
        <template v-else><div class="tooltip-product-heading"><img v-if="productImage(tooltip.product)" :src="productImage(tooltip.product)" alt="" class="tooltip-product-image" width="64" height="64" /><div><h4>{{ tooltip.product.name }}</h4><p class="tooltip-category">{{ tooltip.product.category }}</p></div></div><dl><dt>Заказы с товаром</dt><dd>{{ tooltip.product.orders }}</dd><dt>Количество, шт.</dt><dd>{{ tooltip.product.quantity }}</dd><dt>Потрачено</dt><dd>{{ formatMoney(tooltip.product.spent) }}</dd><dt>Сумма скидок</dt><dd>{{ formatMoney(tooltip.product.savings) }}</dd><dt>Средняя цена / шт.</dt><dd>{{ formatDiscount(tooltip.product.spent / tooltip.product.quantity) }}</dd><dt>Цена / шт. · {{ lastPurchase ? formatMonth(lastPurchase.month, true) : '—' }}</dt><dd>{{ formatDiscount(lastPurchase?.price ?? null) }}</dd></dl><div class="price-trend-heading"><h5>Средняя цена покупки по месяцам</h5><span>₽ / шт.</span></div><price-trend :months="priceHistory" :selected-month="selectedMonth" ></price-trend></template>
      </div>
    </template>
  </main>
  <noscript><p class="state">Включите JavaScript, чтобы посмотреть графики.</p></noscript>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
